[project]
name = "autogpt-service"
version = "0.1.0"
description = "AutoGPT Autonomous Task Engine Service for AI-OS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
